<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- ░░ SEO — FRONT-003 ░░ -->
  <title id="meta-title"></title>
  <meta name="description" id="meta-description"/>
  <meta name="robots" content="index, follow"/>

  <!-- OG -->
  <meta property="og:type" content="website"/>
  <meta property="og:title" id="og-title"/>
  <meta property="og:description" id="og-description"/>
  <meta property="og:image" id="og-image"/>
  <meta property="og:url" id="og-url"/>
  <meta property="og:locale" content="es_AR"/>

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" id="twitter-title"/>
  <meta name="twitter:description" id="twitter-description"/>
  <meta name="twitter:image" id="twitter-image"/>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lora&family=Montserrat&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
</head>

<body>

<header class="navbar" id="navbar">
  <div class="container navbar__inner">
    <a href="#inicio" class="navbar__logo">
      <span class="logo-text" id="logo-text"></span>
      <span class="logo-sub" id="logo-sub"></span>
    </a>

    <nav class="navbar__nav" id="navMenu">
      <ul class="navbar__list">
        <li><a href="#inicio" class="navbar__link">Inicio</a></li>
        <li><a href="#nosotros" class="navbar__link">Nosotros</a></li>
        <li><a href="#menu" class="navbar__link">Menú</a></li>
        <li><a href="#club" class="navbar__link">Club</a></li>
        <li><a href="#contacto" class="navbar__link">Contacto</a></li>
      </ul>
    </nav>

    <button class="navbar__burger" id="navBurger">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="hero" id="inicio">
  <div class="hero__overlay"></div>
  <div class="hero__content">
    <p class="hero__eyebrow" id="hero-eyebrow"></p>
    <h1 class="hero__title" id="hero-title"></h1>
    <p class="hero__sub" id="hero-sub"></p>
    <a href="#contacto" class="btn btn--primary" id="hero-cta"></a>
  </div>
</section>

<section class="welcome" id="nosotros">
  <div class="container welcome__grid">
    <div class="welcome__text">
      <span class="section-tag" id="about-tag"></span>
      <h2 class="section-title" id="about-title"></h2>
      <div class="divider"></div>
      <p id="about-text-1"></p>
      <p id="about-text-2"></p>
      <p class="welcome__highlight" id="about-highlight"></p>
    </div>
    <div class="welcome__image">
      <div class="welcome__img-frame">
        <img id="about-image"/>
      </div>
    </div>
  </div>
</section>

<section class="menu-section" id="menu">
  <div class="container">
    <div class="section-header">
      <span class="section-tag" id="menu-tag"></span>
      <h2 class="section-title" id="menu-title"></h2>
    </div>

    <div class="menu-grid" id="menu-container"></div>
  </div>
</section>

<section class="contact" id="contacto">
  <div class="container contact__grid">

    <div class="contact__map">
      <iframe id="map-frame"></iframe>
    </div>

    <div class="contact__info">
      <span class="section-tag">Encontranos</span>
      <h2 class="section-title">Frená.<br>Estamos acá.</h2>

      <ul class="contact__list">
        <li><span id="contact-address"></span></li>
        <li><a id="contact-phone"></a></li>
        <li><a id="contact-whatsapp" target="_blank"></a></li>
        <li><span id="contact-hours"></span></li>
      </ul>

      <div class="contact__social">
        <a id="social-instagram" target="_blank"><i class="fab fa-instagram"></i></a>
        <a id="social-facebook" target="_blank"><i class="fab fa-facebook"></i></a>
        <a id="social-tiktok" target="_blank"><i class="fab fa-tiktok"></i></a>
      </div>
    </div>

  </div>
</section>

<footer class="footer">
  <p>© <span class="footer__year"></span></p>
</footer>

<a class="fab-whatsapp" id="fab-whatsapp" target="_blank">
  <i class="fab fa-whatsapp"></i>
</a>

<!-- CONFIG -->
<script src="config.js"></script>
<script src="js/main.js"></script>

</body>
</html>
